[package]
name = "oauth2-rust"
version = "0.1.0"
edition = "2021"
description = "Rust client for the Universal SSO gateway (generic OAuth 2.0 provider)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = true
strip = true
